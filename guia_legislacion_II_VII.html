<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {

  /* SIDEBAR */

  .unit-group { margin-bottom: .25rem; }
  .unit-label {
    font-size: 13px; font-weight: 600; color: var(--heading); padding: .55rem 1.25rem;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    border-left: 3px solid transparent; transition: background .15s, border-color .15s;
  }
  .unit-label:hover { background: rgba(255,255,255,.04); }
  .unit-label.active { border-left-color: var(--accent); background: rgba(74,222,154,.07); color: var(--accent); }
  .unit-label .chevron { font-size: 10px; transition: transform .2s; }
  .unit-label.open .chevron { transform: rotate(90deg); }
  .unit-topics { display: none; padding-left: 1.5rem; }
  .unit-topics.open { display: block; }
  .topic-link {
    font-size: 12.5px; color: var(--muted); padding: .35rem .75rem .35rem 0;
    display: block; cursor: pointer; border-left: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .topic-link:hover { color: var(--text); }
  .topic-link.active { color: var(--accent); border-left-color: var(--accent); }

  /* MAIN */
  #main { flex: 1; padding: 2.5rem 3rem; max-width: 900px; }
  .unit-header { display: none; }
  .unit-header.active { display: block; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; background: var(--tag-bg); color: var(--tag-color);
    padding: 3px 10px; border-radius: 20px; margin-bottom: .75rem; }
  .unit-title { font-size: 2rem; font-weight: 700; color: var(--heading); margin-bottom: .5rem; }
  .unit-subtitle { font-size: 15px; color: var(--muted); margin-bottom: 2rem; line-height: 1.6; max-width: 660px; }
  .how-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 1rem 1.25rem; margin-bottom: 2.5rem; display: flex; gap: 1rem; align-items: flex-start;
  }
  .how-icon { font-size: 22px; }
  .how-card h4 { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: .4rem; }
  .how-card p { font-size: 13.5px; color: var(--muted); line-height: 1.65; }
  .how-card strong { color: var(--text); font-weight: 600; }

  /* SECTION / CARD */
  .section { display: none; }
  .section.active { display: block; }
  .section-title { font-size: 1.05rem; font-weight: 600; color: var(--heading); margin: 2rem 0 1rem; display: flex; align-items: center; gap: .5rem; }
  .section-title::before { content: ''; display: inline-block; width: 3px; height: 18px; background: var(--accent2); border-radius: 2px; }

  .card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;
    margin-bottom: .85rem; overflow: hidden;
  }
  .card-header {
    padding: .9rem 1.1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    transition: background .15s;
  }
  .card-header:hover { background: rgba(255,255,255,.03); }
  .card-header h3 { font-size: 14.5px; font-weight: 600; color: var(--heading); }
  .card-icon { font-size: 18px; color: var(--muted); transition: transform .25s; }
  .card.open .card-icon { transform: rotate(45deg); color: var(--accent); }
  .card-body {
    display: none; padding: 0 1.1rem 1.1rem; font-size: 14px; line-height: 1.7; color: var(--text);
    border-top: 1px solid var(--card-border);
  }
  .card.open .card-body { display: block; padding-top: .85rem; }
  .card-body p { margin-bottom: .65rem; }
  .card-body ul { padding-left: 1.2rem; margin-bottom: .65rem; }
  .card-body li { margin-bottom: .4rem; }
  .card-body .highlight { background: rgba(74,222,154,.1); border-left: 3px solid var(--accent); padding: .5rem .75rem; border-radius: 0 6px 6px 0; margin: .75rem 0; font-size: 13.5px; color: var(--text); }
  .card-body .schema { background: var(--detail-bg); border-radius: 8px; padding: .75rem 1rem; margin: .75rem 0; font-size: 13px; font-family: monospace; color: #a5b4fc; line-height: 1.8; }
  .card-body strong { color: var(--heading); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin: 1px 2px; }
  .badge-green { background: rgba(74,222,154,.15); color: #4ade9a; }
  .badge-purple { background: rgba(124,111,247,.15); color: #a5b4fc; }
  .badge-orange { background: rgba(251,146,60,.15); color: #fb923c; }
  .badge-red { background: rgba(248,113,113,.15); color: #f87171; }

  /* FLASH QUIZ */
  .quiz-section { margin-top: 2.5rem; border-top: 1px solid var(--card-border); padding-top: 2rem; }
  .quiz-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent2); margin-bottom: 1rem; }
  .quiz-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: .75rem; }
  .quiz-q { font-size: 14px; font-weight: 600; color: var(--heading); margin-bottom: .6rem; }
  .quiz-toggle { font-size: 12.5px; color: var(--accent); cursor: pointer; display: inline-block; padding: 3px 0; }
  .quiz-a { display: none; margin-top: .6rem; font-size: 13.5px; color: var(--text); line-height: 1.65; background: var(--detail-bg); padding: .65rem .85rem; border-radius: 8px; }
  .quiz-card.revealed .quiz-a { display: block; }
  .quiz-card.revealed .quiz-toggle { color: var(--muted); }

  @media(max-width:768px){
    #sidebar{width:100%;min-width:unset;height:auto;position:static;border-right:none;border-bottom:1px solid var(--card-border);}
    body{flex-direction:column;}
    #main{padding:1.25rem;}
  }
</style>

          { h: "Formas de Estado propiamente dicha (¿cómo?)", b: `<p>Hace referencia al respeto de libertades de los ciudadanos:</p><ul><li><strong>Totalitarismo</strong>: no respeta libertades civiles ni políticas.</li><li><strong>Autocracia</strong>: respeta libertades civiles pero no políticas.</li><li><strong>República</strong>: respeta todas las libertades. Se basa en 5 principios: primacía de la ley · respeto de libertades y garantías · división de funciones · periodicidad en los cargos · publicidad de los actos de gobierno.</li></ul>` },

          { h: "Nombre", b: `<p>Forma de individualización jurídica de la persona. Es el <em>dato de identidad por excelencia</em>. Es indivisible.</p><p>Para personas humanas: <strong>nombre propio</strong> + <strong>apellido</strong> (nombre de familia). El apellido surge históricamente del patronímico medieval.</p><p>La ley 18.248 prohíbe inscribir nombres extravagantes, extranjeros sin castellanización, apellidos como nombre, nombres idénticos a hermanos vivos, o más de 3 nombres.</p><div class="highlight">Para modificar el nombre se requiere petición justificada ante juez competente.</div>` },
          { h: "Domicilio", b: `<p>Asiento jurídico de la persona. Distinguir:</p><ul><li><strong>Residencia</strong>: lugar habitual de vida (valor social, no legal).</li><li><strong>Habitación</strong>: lugar donde se encuentra temporal o accidentalmente.</li></ul><p>Tipos de domicilio:</p><div class="schema">1. De origen: domicilio de los padres al nacer.\n2. Real: donde efectivamente habita.\n3. Legal: el que la autoridad considera o presume.\n4. Fiscal: a efectos tributarios.\n5. Especial: constituido para un fin particular (ej.: contractual, procesal).</div>` },

function buildNav() {
  const nav = document.getElementById('nav');
  units.forEach((u, ui) => {
    const group = document.createElement('div');
    group.className = 'unit-group';
    const lbl = document.createElement('div');
    lbl.className = 'unit-label' + (ui === 0 ? ' active open' : '');
    lbl.dataset.unit = u.id;
    lbl.innerHTML = u.label + '<span class="chevron">▶</span>';
    const topics = document.createElement('div');
    topics.className = 'unit-topics' + (ui === 0 ? ' open' : '');
    u.sections.forEach(s => {
      const a = document.createElement('div');
      a.className = 'topic-link';
      a.dataset.unit = u.id;
      a.dataset.section = s.id;
      a.textContent = s.title;
      a.onclick = (e) => { e.stopPropagation(); showSection(u.id, s.id); };
      topics.appendChild(a);
    });
    lbl.onclick = () => {
      const open = lbl.classList.contains('open');
      document.querySelectorAll('.unit-label').forEach(l => { l.classList.remove('open'); });
      document.querySelectorAll('.unit-topics').forEach(t => { t.classList.remove('open'); });
      if (!open) { lbl.classList.add('open'); topics.classList.add('open'); }
      showUnit(u.id);
    };
    group.appendChild(lbl); group.appendChild(topics);
    nav.appendChild(group);
  });
}

function buildContent() {
  const content = document.getElementById('content');
  units.forEach((u, ui) => {
    const hdr = document.createElement('div');
    hdr.className = 'unit-header' + (ui === 0 ? ' active' : '');
    hdr.id = 'hdr-' + u.id;
    hdr.innerHTML = `<div class="tag">${u.tag}</div><h1 class="unit-title">${u.title}</h1><p class="unit-subtitle">${u.subtitle}</p>
    <div class="how-card"><div class="how-icon">🧠</div><div><h4>Cómo usar esta guía</h4><p>${u.how} Abrí cada tarjeta <strong>después de intentar responder vos mismo</strong>.</p></div></div>`;

    u.sections.forEach(s => {
      const sec = document.createElement('div');
      sec.className = 'section' + (ui === 0 && u.sections[0].id === s.id ? ' active' : '');
      sec.id = 'sec-' + u.id + '-' + s.id;
      let html = `<div class="section-title">${s.title}</div>`;
      s.cards.forEach((c, ci) => {
        html += `<div class="card" id="card-${u.id}-${s.id}-${ci}">
          <div class="card-header" onclick="toggleCard('card-${u.id}-${s.id}-${ci}')">
            <h3>${c.h}</h3><span class="card-icon">+</span>
          </div>
          <div class="card-body">${c.b}</div>
        </div>`;
      });
      sec.innerHTML = html;
      hdr.appendChild(sec);
    });

    // Quiz
    const qs = document.createElement('div');
    qs.className = 'quiz-section';
    qs.innerHTML = `<div class="quiz-title">⚡ Repaso relámpago</div>` +
      u.quiz.map((q, qi) => `<div class="quiz-card" id="quiz-${u.id}-${qi}">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-toggle" onclick="revealQuiz('quiz-${u.id}-${qi}')">Ver respuesta →</div>
        <div class="quiz-a">${q.a}</div>
      </div>`).join('');
    hdr.appendChild(qs);
    content.appendChild(hdr);
  });
}

function showUnit(uid) {
  document.querySelectorAll('.unit-header').forEach(h => h.classList.remove('active'));
  document.querySelectorAll('.unit-label').forEach(l => { l.classList.remove('active'); if (l.dataset.unit === uid) l.classList.add('active'); });
  const hdr = document.getElementById('hdr-' + uid);
  if (hdr) { hdr.classList.add('active'); const first = hdr.querySelector('.section'); if (first) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); first.classList.add('active'); } }
  updateTopicLinks(uid, null);
}

function showSection(uid, sid) {
  showUnit(uid);
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('sec-' + uid + '-' + sid);
  if (sec) sec.classList.add('active');
  updateTopicLinks(uid, sid);
}

function updateTopicLinks(uid, sid) {
  document.querySelectorAll('.topic-link').forEach(l => {
    l.classList.remove('active');
    if (l.dataset.unit === uid && (sid === null || l.dataset.section === sid)) l.classList.add('active');
  });
}

function toggleCard(id) {
  const card = document.getElementById(id);
  if (card) card.classList.toggle('open');
}

function revealQuiz(id) {
  const card = document.getElementById(id);
  if (card) { card.classList.add('revealed'); card.querySelector('.quiz-toggle').textContent = 'Respuesta visible'; }
}

buildNav();
buildContent();
showUnit(units[0].id);
showSection(units[0].id, units[0].sections[0].id);
</script>
